# agent-mcp-baseline.yaml
#
# Example assayward TrustPolicy for MCP servers an agent runtime is about to
# load. This is the spec section 7 worked example, agents may only load MCP
# servers signed by publisher X, SLSA L2 plus, with no undeclared network
# egress and no affected criticals, minus the network egress gate, which
# assayward v0.1.0 cannot express yet. See the PENDING assayward#1 block at
# the bottom of this file and policies/README.md for the full story.
#
# smithmark never decides here (spec section 1.3). It only produces the
# Evidence block (pkg/core/verify.EvidenceBlock) that this policy evaluates,
# inside assayward, not inside smithmark.
#
# Today: smithmark verify's positional argument takes the artifact directly,
# there is no --ref and no --evidence-out flag. The Evidence block lives in
# the .evidence field of the --output json report, produced with:
#
#   smithmark verify <mcp server ref> --trust-root <pubkey> --output json
#
# assayward v0.1.0 has no CLI flag that ingests that Evidence JSON directly:
# its own verify command takes --policy-file (or a built in --policy name)
# plus --image, with --bundle, --from-oci, or --forgeseal-output supplying
# the attestation evidence, none of which reads a smithmark report. Today
# the two sides are proven compatible only at the Go type level: the pinned
# contract test (pkg/core/verify/contract_test.go) round trips smithmark's
# Evidence block through assayward's own pkg/core.Evidence type with strict
# decoding. CLI level ingestion of a smithmark Evidence block is tracked in
# PENDING assayward#1 (https://github.com/sns45/assayward/issues/1).
#
# Intended end to end wiring once assayward#1 ships (PENDING assayward#1;
# NOT a working command today):
#
#   smithmark verify <mcp server ref> --trust-root <pubkey> --output json \
#     > report.json
#
#   Then assayward would evaluate policies/agent-mcp-baseline.yaml against
#   the Evidence carried in report.json's .evidence field. assayward v0.1.0
#   names no flag for that step, so none is shown here; once assayward#1
#   ships, the assayward side of this line grows a real flag and this
#   comment is updated to a runnable command rather than prose.
#
# Validated against the pinned assayward v0.1.0 CLI with:
#   go run github.com/sns45/assayward/cmd/assayward@v0.1.0 \
#     policy validate policies/agent-mcp-baseline.yaml
#
apiVersion: assayward.dev/v1alpha1
kind: TrustPolicy
metadata:
  name: agent-mcp-baseline
  version: v0.1.0
spec:
  mode: enforce

  signature:
    # smithmark v0.1 attest signs skill and MCP manifests with a maker held
    # keyed CA offline, the same posture forgeseal's own dogfood policy
    # documents (see the assayward repo's testdata/dogfood/policy-dogfood.yaml,
    # read while designing this file). assayward's wire schema names this
    # block "keyless" regardless of whether the leaf certificate chains to a
    # true keyless Fulcio issuer or an injected keyed CA; an empty issuer plus
    # an identityPattern is how a keyed CA is expressed here. "publisher-x" is
    # a placeholder for the spec's worked example publisher; swap it for the
    # real cert SAN pattern at adoption time.
    required: true
    keyless:
      issuer: ""
      identityPattern: "https://github.com/publisher-x/*"
    rekor:
      # smithmark v0.1 verify is exercised against key based, offline
      # signatures with no transparency log entry, so nothing here requires
      # one yet. Compare skill-strict.yaml, which does, and the comment
      # there about the tension that creates.
      required: false

  slsa:
    # Spec section 7 worked example: SLSA L2 plus.
    minLevel: 2
    allowedBuilders:
      - "https://github.com/publisher-x/*"

  vex:
    # No affected criticals unmitigated; high and below may ship with an
    # accepted VEX statement. Caveat: in assayward v0.1.0 this field acts as
    # a binary affected gate rather than a severity aware one: any CVE whose
    # VEX status is affected fails the check regardless of the value set
    # here, per assayward's pkg/core/policy/evaluate.go. Severity aware
    # gating, where this value would actually bound which affected CVEs are
    # tolerated, lands in a future assayward version. The field and the
    # value high are kept as is: the schema is valid today and the setting
    # is forward compatible with that future gating.
    maxUnmitigatedSeverity: high

  sbom:
    required: true

  identity:
    # Third party MCP publishers rarely run inside the agent operator's own
    # SPIFFE trust domain, so workload identity is optional at this gate
    # rather than required. Tighten this per deployment when agents only
    # load servers built inside a known CI trust domain.
    required: false

# PENDING assayward#1 (https://github.com/sns45/assayward/issues/1)
# NOT YET SUPPORTED by assayward v0.1.0; do not uncomment, it fails
# `policy validate` because v0.1.0's strict decoder rejects unknown fields.
#
# The spec section 7 worked example also wants "no undeclared network
# egress". That gate needs the capability lint findings smithmark already
# computes (pkg/core/lint, finding codes such as UNDECLARED_NETWORK_EGRESS)
# carried inside the Evidence block assayward reads, and assayward v0.1.0's
# Evidence has no findings field to carry them in (docs/decisions.md U5).
# Once assayward#1 ships a findings carrying Evidence, this baseline policy
# is meant to grow a stanza shaped roughly like:
#
#   capabilities:
#     maxUndeclared: 0
#     deniedFindings:
#       - UNDECLARED_NETWORK_EGRESS
#
# That block is illustrative prose sketching the intended shape, not live
# schema.
