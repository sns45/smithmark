# skill-strict.yaml
#
# Example assayward TrustPolicy for skill bundles, stricter than
# agent-mcp-baseline.yaml: full SLSA L3, a required Rekor transparency log
# entry, and (once assayward#1 ships) a capability gate that denies every
# undeclared capability class rather than only network egress.
#
# smithmark never decides here (spec section 1.3). It only produces the
# Evidence block (pkg/core/verify.EvidenceBlock) that this policy evaluates,
# inside assayward, not inside smithmark.
#
# Validated against the pinned assayward v0.1.0 CLI with:
#   go run github.com/sns45/assayward/cmd/assayward@v0.1.0 \
#     policy validate policies/skill-strict.yaml
#
apiVersion: assayward.dev/v1alpha1
kind: TrustPolicy
metadata:
  name: skill-strict
  version: v0.1.0
spec:
  mode: enforce

  signature:
    # Unlike agent-mcp-baseline.yaml, this policy names a real keyless
    # issuer and requires a Rekor entry below, anticipating the M6 dogfood
    # milestone where smithmark's own CI moves to keyless Sigstore signing
    # (Fulcio plus Rekor) for its releases. Tension worth naming plainly:
    # smithmark v0.1 verify today is exercised against key based, offline
    # signatures, the fixtures under testdata carry no Rekor entry, so a
    # skill signed by today's v0.1 attest path would fail this policy's
    # rekor.required gate until that CI migration lands. Point this policy
    # at agent-mcp-baseline.yaml's keyed posture in the meantime if you need
    # something that passes against v0.1 signed fixtures today.
    required: true
    keyless:
      issuer: "https://token.actions.githubusercontent.com"
      identityPattern: "https://github.com/publisher-x/*"
    rekor:
      required: true

  slsa:
    minLevel: 3
    allowedBuilders:
      - "https://github.com/publisher-x/*"

  vex:
    maxUnmitigatedSeverity: high

  sbom:
    required: true

  identity:
    required: true
    trustDomain: "spiffe://ci.publisher-x.dev"
    idPattern: "spiffe://ci.publisher-x.dev/github-actions/*"

# PENDING assayward#1 (https://github.com/sns45/assayward/issues/1)
# NOT YET SUPPORTED by assayward v0.1.0; do not uncomment, it fails
# `policy validate` because v0.1.0's strict decoder rejects unknown fields.
#
# Where agent-mcp-baseline.yaml's forward looking stanza names one denied
# finding, this stricter policy is meant to deny every undeclared capability
# class smithmark's lint already detects (pkg/core/lint, pkg/core/codes),
# once assayward#1 lands a findings carrying Evidence block:
#
#   capabilities:
#     maxUndeclared: 0
#     deniedFindings:
#       - UNDECLARED_NETWORK_EGRESS
#       - UNDECLARED_FILESYSTEM
#       - UNDECLARED_EXEC
#       - UNDECLARED_ENV
#
# That block is illustrative prose sketching the intended shape, not live
# schema. It also depends on assayward#1's algorithm aware digest matching:
# a skill subject's Evidence digest carries a smithmark-bundle-v1 prefixed
# key (docs/decisions.md U4), not a plain sha256 one, and assayward's
# verify/slsa.go today strips a literal "sha256:" prefix unconditionally, so
# matching a skill subject correctly needs that widening too.
