# assayward-dogfood-policy.yaml
#
# smithmark's own release gate policy, mirroring forgeseal's
# assayward-dogfood-policy.yaml pattern (spec section 11). Applied by
# .github/workflows/assayward-gate.yml on every published release.
#
# smithmark never decides here (spec section 1.3). This policy is evaluated
# by assayward, a separate tool, against the evidence the release workflow
# produces (forgeseal's SBOM and SLSA provenance for smithmark itself, plus
# the keyless Sigstore signature over the release binaries).
#
# Validated against the pinned assayward v0.1.0 CLI with:
#   go run github.com/sns45/assayward/cmd/assayward@v0.1.0 \
#     policy validate assayward-dogfood-policy.yaml
#
apiVersion: assayward.dev/v1alpha1
kind: TrustPolicy
metadata:
  name: smithmark-dogfood
  version: v0.1.0
spec:
  mode: enforce

  signature:
    # The release binaries are signed keyless in CI (Fulcio short lived
    # certificate plus Rekor transparency log entry, exchanged for the
    # workflow's OIDC identity token; no long lived private key is held by
    # the maintainer). The identity pattern matches the certificate SAN
    # GitHub Actions OIDC issues for this repository's workflows.
    required: true
    keyless:
      issuer: "https://token.actions.githubusercontent.com"
      identityPattern: "https://github.com/sns45/smithmark/*"
    rekor:
      # Mirroring forgeseal's own dogfood policy: the keyless path does log
      # to Rekor, but this is left false until the first live tagged run
      # confirms the transparency log entry lands reliably from this
      # workflow. Tighten to true once that run is observed, the same
      # honest sequencing forgeseal's own policy followed.
      required: false

  slsa:
    # forgeseal's provenance heuristic (deriveBuildLevel in assayward's
    # verify/slsa.go) reports level 3 when builder.id is a nonempty https
    # URI and buildType is set, which is what a GitHub Actions run produces.
    minLevel: 3
    allowedBuilders:
      - "https://github.com/sns45/*"

  vex:
    maxUnmitigatedSeverity: high

  sbom:
    # forgeseal produces the dependency SBOM for smithmark itself; smithmark
    # composes forgeseal rather than duplicating SBOM generation.
    required: true

  identity:
    # No SPIFFE/SVID infrastructure runs in smithmark's release workflow
    # (unlike forgeseal's optional svidmint step); the keyless Sigstore
    # signature above is the workload identity smithmark's release gate
    # relies on.
    required: false
