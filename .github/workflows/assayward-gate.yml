name: Assayward Release Gate

# Mirrors forgeseal's separate assayward gate workflow (spec section 11):
# the release workflow (release.yml) produces and publishes the evidence,
# this workflow evaluates the published release against
# assayward-dogfood-policy.yaml in its own job, on its own trigger.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assayward-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned to assayward v0.2.0, whose --forgeseal-output adapter discovers
      # SLSA/SBOM/VEX by CONTENT rather than fixed filenames (assayward#2), so
      # this gate no longer needs the cp staging bridge the v0.1.0 adapter
      # required. smithmark emits the v0.2.0 Evidence shape (ArtifactRef +
      # schemaVersion), pinned by the cross-repo contract test.
      - name: Install assayward
        run: |
          go install github.com/sns45/assayward/cmd/assayward@v0.2.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # This job runs in its own checkout with no filesystem in common with
      # the release job that produced the evidence, so it downloads the
      # supply chain assets release.yml attached to the published release
      # (the forgeseal dependency SBOM and provenance for smithmark, and the
      # keyless Sigstore signature and provenance over the release
      # checksums) rather than assuming they are already on disk.
      - name: Download supply chain evidence from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./forgeseal-output
          tag="${GITHUB_REF#refs/tags/}"
          gh release download "$tag" \
            --pattern "sbom.cdx.json*" \
            --pattern "checksums.txt*" \
            --dir ./forgeseal-output \
            --clobber

      # No staging bridge needed anymore. assayward v0.2.0's --forgeseal-output
      # adapter discovers forgeseal's real output by CONTENT: the SLSA
      # provenance is found from its Sigstore bundle
      # (sbom.cdx.json.intoto.jsonl.sigstore.json) directly, and a missing VEX
      # is a soft skip rather than a hard error. The dogfood policy's VEX check
      # (maxUnmitigatedSeverity) only denies on a CVE with status "affected";
      # an absent VEX attestation yields zero affected CVEs, so the check
      # passes exactly as the old empty-statements stub did — no real OSV.dev
      # triage is claimed. This removes the cp-only bridge and the synthetic
      # VEX file that assayward#2 was built to make unnecessary.
      - name: Compute dependency SBOM digest
        id: digest
        run: |
          DIGEST="sha256:$(sha256sum ./forgeseal-output/sbom.cdx.json | awk '{print $1}')"
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      # This gate genuinely blocks: assayward-dogfood-policy.yaml's SLSA
      # level, allowed builder, subject digest match, and SBOM presence
      # checks are all confirmed working through --forgeseal-output (tested
      # locally against a real forgeseal output directory), so a DENY on
      # any of those fails this job, no continue-on-error.
      #
      # signature.required is false in the policy today, a scoped, not an
      # overstated, gap. assayward's engine runs its signature verifier
      # over the discovered SLSA bundle, and the native verifier
      # (pkg/core/verify/sigstore_native.go) does have a real keyless path,
      # falling back to the Sigstore public good live TUF root and
      # verifying the Fulcio certificate chain plus Rekor inclusion when no
      # --sigstore-trust-root is injected. Read from source, this plausibly
      # succeeds against the genuinely keyless bundle release.yml produces
      # in CI, but that is unconfirmed: the only local test used a keyed,
      # offline signed bundle with no --signature-ca supplied, which fails
      # through a different code path (VerifyKeyedBundle) and does not
      # establish that the keyless path fails too. Flip signature.required
      # (and the release checksums subject, which this gate does not
      # evaluate today) back to true once the first live tagged run
      # confirms the discovered SLSA bundle actually verifies keyless here; a
      # cosign verify-blob style companion step is the future closure for
      # the release checksums themselves.
      - name: Assayward gate
        run: |
          assayward verify \
            --policy-file ./assayward-dogfood-policy.yaml \
            --image "smithmark-release@${{ steps.digest.outputs.value }}" \
            --forgeseal-output ./forgeseal-output
