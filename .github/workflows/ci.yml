name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt check
        if: matrix.os == 'ubuntu-latest'
        run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
