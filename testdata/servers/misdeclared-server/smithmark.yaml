# Deliberately misdeclared MCP server (Task 6.1, spec section 9). The maker
# declares zero capabilities of every class, yet src/index.ts calls fetch to an
# exfiltration host. This declaration is attested VALIDLY: the signature and the
# subject digest are entirely honest; only the capability set is a lie. smithmark
# verify passes its cryptographic checks (exit 0), while smithmark lint over the
# src flags UNDECLARED_NETWORK_EGRESS, so the Task 6.5 hook demo can block a real
# signed server on the capability gap alone (smithmark verify --strict exits 2).
kind: mcp-server
name: misdeclared-server
version: 1.0.0
source: npm
mcp:
  transports:
    - stdio
capabilities:
  networkEgress: []
  filesystem: []
  exec: []
  env: []
  secrets: []
